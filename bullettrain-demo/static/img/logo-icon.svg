<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140">
  <!-- Speed lines (trailing left) -->
  <line x1="0" y1="58" x2="60" y2="58" stroke="#1B9EFF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <line x1="0" y1="68" x2="48" y2="68" stroke="#4DCFFF" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
  <line x1="0" y1="76" x2="38" y2="76" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <!-- Train body (sleek aerodynamic shape) -->
  <path d="M55 28 Q60 14 82 10 L138 10 Q158 10 166 22 L172 32 Q176 40 172 50 L168 58 Q160 66 142 68 L76 68 Q64 68 58 60 Z" fill="url(#bodyGrad)" stroke="rgba(200,220,255,0.2)" stroke-width="0.5"/>
  <!-- Windshield -->
  <path d="M138 12 L150 12 Q164 14 170 24 L174 34 Q170 24 158 22 L138 20 Z" fill="#0D1B2E" stroke="rgba(100,160,255,0.3)" stroke-width="0.5"/>
  <!-- Blue accent stripe -->
  <path d="M60 60 L142 60 Q156 60 164 54 L168 50" stroke="#1B9EFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9"/>
  <!-- Top highlight -->
  <path d="M88 12 L140 12 Q152 12 160 18" stroke="rgba(220,235,255,0.5)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Wheel housings -->
  <ellipse cx="92" cy="69" rx="9" ry="4" fill="rgba(10,14,26,0.8)"/>
  <ellipse cx="140" cy="69" rx="9" ry="4" fill="rgba(10,14,26,0.8)"/>
  <!-- Ground reflection -->
  <line x1="0" y1="76" x2="175" y2="76" stroke="rgba(27,158,255,0.12)" stroke-width="1"/>
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8E6F8"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#B8CADF"/>
      <stop offset="100%" stop-color="#7888A8"/>
    </linearGradient>
  </defs>
</svg>
